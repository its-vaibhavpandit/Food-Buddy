<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Fast Food</title>
  <link rel="icon" type="image/png" href="img/favi.png">
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="logo">🍔 🍕 Welcome  Fast Food Buddy Partner 🥂🍟 </h2>
      <ul>
        <li><a href="#"><i class="fas fa-chart-line"></i> Dashboard</a></li>
        <li><a href="#"><i class="fas fa-hamburger"></i> Manage Items</a></li>
        <li><a href="#"><i class="fas fa-shopping-bag"></i> Orders</a></li>
        <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
        <li><a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <h1>  Resturent Admin </h1>
        <div class="admin-actions">
          <i class="fas fa-bell"></i>
          <i class="fas fa-user-circle"></i>
        </div>
      </header>

      <!-- Dashboard Cards -->
      <section class="dashboard">
        <div class="card">
          <h3>Total Orders</h3>
          <p>124</p>
        </div>
        <div class="card">
          <h3>Active Users</h3>
          <p>87</p>
        </div>
        <div class="card">
          <h3>Menu Items</h3>
          <p>35</p>
        </div>
        <div class="card">
          <h3>Revenue</h3>
          <p>₹52,000</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
